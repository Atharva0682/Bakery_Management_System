<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="crumbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A85F2C"/>
      <stop offset="50%" stop-color="#8B4C20"/>
      <stop offset="100%" stop-color="#5A3014"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="sheenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background squircle -->
  <rect x="0" y="0" width="120" height="120" rx="32" fill="url(#crumbGrad)"/>
  <!-- Subtle top sheen -->
  <rect x="0" y="0" width="120" height="60" rx="32" fill="url(#sheenGrad)"/>
  <!-- Delicate inner golden border -->
  <rect x="3" y="3" width="114" height="114" rx="29" fill="none" stroke="#FDE68A" stroke-opacity="0.25" stroke-width="1.5"/>

  <!-- Artisanal Wheat & Croissant Emblem -->
  <g id="bakery-emblem" transform="translate(60, 60)">
    <!-- Wheat Stalks (Left & Right framing) -->
    <g stroke="url(#goldGrad)" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.9">
      <!-- Left wheat grains -->
      <path d="M-32,14 C-36,6 -34,-6 -26,-14 C-26,-8 -28,4 -32,14 Z" fill="#FDE68A" fill-opacity="0.35"/>
      <path d="M-28,-2 C-32,-10 -28,-20 -20,-26 C-20,-18 -22,-8 -28,-2 Z" fill="#FDE68A" fill-opacity="0.35"/>
      <path d="M-20,-14 C-22,-22 -16,-32 -8,-36 C-10,-28 -14,-18 -20,-14 Z" fill="#FDE68A" fill-opacity="0.35"/>
      <!-- Right wheat grains -->
      <path d="M32,14 C36,6 34,-6 26,-14 C26,-8 28,4 32,14 Z" fill="#FDE68A" fill-opacity="0.35"/>
      <path d="M28,-2 C32,-10 28,-20 20,-26 C20,-18 22,-8 28,-2 Z" fill="#FDE68A" fill-opacity="0.35"/>
      <path d="M20,-14 C22,-22 16,-32 8,-36 C10,-28 14,-18 20,-14 Z" fill="#FDE68A" fill-opacity="0.35"/>
    </g>

    <!-- Golden Croissant / Artisan Bread in center -->
    <g transform="translate(0, 4)">
      <!-- Main body crescent -->
      <path d="M-26,10 C-22,-4 -12,-12 0,-12 C12,-12 22,-4 26,10 C18,14 8,12 0,9 C-8,12 -18,14 -26,10 Z"
            fill="url(#goldGrad)" stroke="#FEF3C7" stroke-width="1.8" stroke-linejoin="round"/>
      <!-- Inner pastry ridges / cuts -->
      <path d="M-14,7 C-10,-2 -4,-6 0,-6 C4,-6 10,-2 14,7" fill="none" stroke="#78350F" stroke-width="1.8" stroke-linecap="round" opacity="0.75"/>
      <path d="M-7,3 C-4,-1 0,-3 0,-3 C0,-3 4,-1 7,3" fill="none" stroke="#78350F" stroke-width="1.5" stroke-linecap="round" opacity="0.65"/>
    </g>

    <!-- Rising Aroma / Steam swirls -->
    <path d="M-8,-16 Q-12,-22 -7,-27" fill="none" stroke="#FEF3C7" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
    <path d="M0,-18 Q4,-25 0,-31" fill="none" stroke="#FEF3C7" stroke-width="2.2" stroke-linecap="round" opacity="0.95"/>
    <path d="M8,-16 Q12,-22 7,-27" fill="none" stroke="#FEF3C7" stroke-width="2" stroke-linecap="round" opacity="0.85"/>

    <!-- Sparkle / Star of excellence -->
    <circle cx="0" cy="24" r="2.2" fill="#FEF3C7"/>
  </g>
</svg>
